<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMIb</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-div">
      <div class="sub-div">
        <h3>Body Mass Index (BMI) Calculator</h3>
        <span>Height (cm) </span>
        <input
          class="input"
          id="height"
          type="number"
          value="170"
          name="height"
        />
        <span>Weight (kg) </span>
        <input
          class="input"
          id="weight"
          type="number"
          value="65"
          name="weight"
        />
        <button id="btn" class="input" type="submit">Compute BMI</button>
        <input class="input" id="BMI" disabled name="BMI" value="" />
        <p>Weight Condition<span id="WC"></span></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
